<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Calendar Assistant</title>
    <link rel="stylesheet" href="style/global.css" />
    <link rel="stylesheet" href="style/panel.css" />
  </head>

  <body>
    <div class="panel-container" id="panel-container">
      <div class="chat-container" id="chat-container">
        <div class="chat-header">
          <div class="chat-header-title">
            <div class="chat-icon-container">
              <img class="chat-icon" src="../../assets/images/gemini-logo.png"/>
            </div>
            <div class="chat-title">
              <p>Google Calendar Assistant</p>
            </div>
          </div>

          <div class="chat-header-buttons">
            <button type="button" class="clear-chat-button tooltip-header" id="clear-chat-button">
              <img class="bin-button-icon" src="../../assets/images/reset-icon.png"/>
              <span class="tooltip-text-header">Clear chat</span>
            </button>
            <button type="button" class="resize-chat-button tooltip-header" id="resize-chat-button">
              <img class="resize-button-icon" src="../../assets/images/resize-icon.png"/>
              <span class="tooltip-text-header">Resize window</span>
            </button>
            <button type="button" class="close-chat-button tooltip-header" id="close-chat-button">
              <img class="close-button-icon" src="../../assets/images/close-icon.png"/>
              <span class="tooltip-text-header">Close</span>
            </button>
          </div>
        </div>

        <div class="chat-messages" id="chat-messages">
          <div class="message ai">
            <div class="avatar"></div>
            <div class="message-content">
              <div class="message-bubble">Hello! How can I help you today?</div>
              <div class="message-time" id="initial-time"></div>
            </div>
          </div>
        </div>

        <div class="chat-input-area">
          <form class="input-form" id="chat-form">
            <div class="dropdown" id="mode-dropdown">
              <button type="button" class="dropdown-btn tooltip" id="mode-btn">
                <img class="dropdown-btn-icon" src="../../assets/images/plus-icon.png"/>
                <span class="tooltip-text">Instruments</span>
              </button>
            </div>

            <div class="input-wrapper">
              <textarea
                class="chat-textarea"
                id="chat-input"
                placeholder="Ask me anything"
                rows="1"
              ></textarea>
            </div>

            <button type="submit" class="action-button tooltip" id="action-button">
              <img
                class="action-button-icon"
                src="../../assets/images/arrow-up-line.png"
                id="action-icon"
              />
              <span class="tooltip-text" id="tooltip-text">Send</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
