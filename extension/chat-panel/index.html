<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat Panel</title>
</head>

<body>
    <div>
        <div>
            <div>
                <img src="./assests/images/gemini-logo.png"/>
            </div>
            <div>
                <h1>Google Calendar Assistant</h1>
            </div>
        </div>

        <div>
            <div>
                <div>
                    <img src="./assests/images/gemini-chat-bot-logo.png"/>
                </div>
                <div>
                    <div>Hello! How can I help you today?</div>
                    <div></div>
                </div>
            </div>
        </div>

        <div>
            <form>
                <div>
                    <button>
                        <img src="./assests/images/plus-icon.png"/>
                    </button> 
                    <div>
                        <button data-mode="SmartAdd">
                            <div>
                                <img src="./assests/images/brain-icon.png"/>
                            </div>
                            <div>
                                <h3>Smart add</h3>
                                <p>Quickly create events using natural language.</p>
                            </div>
                        </button>
                        <button data-mode="Suggestion">
                            <div>
                                <img src="./assests/images/light-bulb-icon.png"/>
                            </div>
                            <div>
                                <h3>Suggestion</h3>
                                <p>Get event ideas or optimize your schedule.</p>
                            </div>
                        </button>
                        <button data-mode="Reschedule">
                            <div>
                                <img src="./assests/images/calendar-plus-icon.png"/>
                            </div>
                            <div>
                                <h3>Reschedule</h3>
                                <p>Find new times for your existing events.</p>
                            </div>
                        </button>
                    </div>
                </div>

                <div>
                    <textarea placeholder="Ask me anything..." rows="1"></textarea>
                </div>
                
                <button type="button">
                    <img src="./assests/images/microphone-icon.png">
                </button>
                <button type="submit">
                    <img src="./assests/images/send-arrow-icon.png"/>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
