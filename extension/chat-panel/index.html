<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chat Panel</title>
  </head>

  <body>
    <div>
      <div>
        <div>
          <div>
            <div>
              <img src="./assets/images/gemini-logo.png" />
            </div>
            <div>
              <p>Google Calendar Assistant</p>
            </div>
          </div>

          <div>
            <button type="button">
              <img src="./assets/images/reset-icon.png" />
              <span>Clear Chat</span>
            </button>

            <button type="button">
              <img src="./assets/images/resize-icon.png" />
              <span>Resize Window</span>
            </button>

            <button type="button">
              <img src="./assets/images/close-icon.png" />
              <span>Close Chat</span>
            </button>
          </div>
        </div>

        <div>
          <div>
            <div>
              <img src="./assets/images/gemini-chat-bot-logo.png" />
            </div>
            <div>
              <div>Hello! How can I help you today?</div>
              <div></div>
            </div>
          </div>
        </div>

        <div>
          <form>
            <div>
              <button type="button">
                <img src="./assets/images/plus-icon.png" />
                <span>Select<br />Instrument</span>
              </button>

              <div>
                <h3>Choose an instrument</h3>

                <button type="button" data-mode="SmartAdd">
                  <div>
                    <img src="./assets/images/brain-icon.png" />
                  </div>
                  <div>
                    <h3>Smart add</h3>
                    <p>Quickly create events using natural language.</p>
                  </div>
                </button>

                <button type="button" data-mode="Suggestion">
                  <div>
                    <img src="./assets/images/light-bulb-icon.png" />
                  </div>
                  <div>
                    <h3>Suggestion</h3>
                    <p>Get event ideas or optimize your schedule.</p>
                  </div>
                </button>

                <button type="button" data-mode="Reschedule">
                  <div>
                    <img src="./assets/images/calendar-plus-icon.png" />
                  </div>
                  <div>
                    <h3>Reschedule</h3>
                    <p>Find new times for your existing events.</p>
                  </div>
                </button>
              </div>
            </div>

            <div>
              <textarea placeholder="Ask me anything" rows="1"></textarea>
            </div>

            <button type="submit">
              <img src="./assets/images/microphone-icon.png" />
              <span>Dictate</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
