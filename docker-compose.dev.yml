version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev               
    volumes:
      - ./backend:/app              
      - /app/node_modules             
    ports:
      - "8080:8080"               
    environment:
      - NODE_ENV=development
      - PORT=8080
    restart: unless-stopped
